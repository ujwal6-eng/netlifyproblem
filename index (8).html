<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medium Image with GitHub Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #0a0a16;
            height: 100vh;
            overflow: hidden;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .image-container {
            width: 70%;
            max-width: 800px;
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: all 0.5s ease-in-out;
            position: relative;
            margin-bottom: 30px;
        }
        
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .image-container img:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }
        
        .image-container.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: rgba(0, 0, 0, 0.9);
            margin: 0;
        }
        
        .image-container.fullscreen img {
            width: 95%;
            height: 95%;
            object-fit: contain;
            border-radius: 0;
            box-shadow: none;
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        
        .btn {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        
        .btn-fullscreen {
            background: linear-gradient(135deg, #1a2a6c, #fdbb2d);
        }
        
        .btn-exit-fullscreen {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 101;
            background: rgba(0, 0, 0, 0.7);
        }
        
        .image-container.fullscreen ~ .btn-exit-fullscreen {
            display: block;
        }
        
        .text-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            z-index: 1;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            pointer-events: none;
        }
        
        .text-container.visible {
            opacity: 1;
            z-index: 50;
            pointer-events: auto;
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            background: linear-gradient(45deg, #fff, #a0d2ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        p {
            font-size: 1.8rem;
            max-width: 800px;
            line-height: 1.6;
            margin-bottom: 40px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
        }
        
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }
        
        .github-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 18px 30px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .github-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 0.25);
        }
        
        .link-icon {
            font-size: 1.5rem;
        }
        
        .repo-link {
            background: linear-gradient(135deg, #24292e, #3a3f44);
        }
        
        .pages-link {
            background: linear-gradient(135deg, #1a2a6c, #3366cc);
        }
        
        .timer {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 1.4rem;
            font-weight: bold;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        
        .progress-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            max-width: 800px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 10;
            border-radius: 3px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #1a2a6c, #b21f1f, #fdbb2d);
            transform-origin: left;
            animation: progress 10s linear forwards;
        }
        
        @keyframes progress {
            0% { transform: scaleX(0); }
            100% { transform: scaleX(1); }
        }
        
        .instructions {
            color: rgba(255, 255, 255, 0.7);
            margin-top: 15px;
            font-size: 1rem;
            text-align: center;
        }
        
        .link-description {
            font-size: 1rem;
            margin-top: 5px;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            .image-container {
                width: 90%;
                height: 50vh;
            }
            
            .progress-bar {
                width: 90%;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            p {
                font-size: 1.4rem;
            }
            
            .github-link {
                font-size: 1.1rem;
                padding: 15px 20px;
            }
            
            .links-container {
                gap: 15px;
            }
            
            .controls {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="timer" id="timer">10</div>
        
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
        
        <div class="image-container" id="imageContainer">
            <img src="https://uploads.onecompiler.io/43yn8ycmd/43yrfuvdy/Screenshot%202025-10-05%20200422.png" 
                 alt="Medium Sized Image" 
                 id="mainImage">
        </div>
        
        <div class="controls">
            <button class="btn btn-fullscreen" id="fullscreenBtn">View Full Screen</button>
            <button class="btn" id="replayBtn">Replay Animation</button>
        </div>
        
        <p class="instructions">Click the image or button to view in full screen</p>
        
        <button class="btn btn-exit-fullscreen" id="exitFullscreenBtn">Exit Full Screen</button>
        
        <div class="text-container" id="textContainer">
            <h1>Netlify Premium Notice</h1>
            <p>Netlify is premium, so I want to send you GitHub links instead.</p>
            
            <div class="links-container">
                <a href="https://github.com/ujwal6-eng/Laundry-Wallah-Laundry-Mart" 
                   class="github-link repo-link" 
                   target="_blank">
                    <span class="link-icon">📁</span>
                    GitHub Repository
                    <div class="link-description">View the source code</div>
                </a>
                
                <a href="https://ujwal6-eng.github.io/Laundry-Wallah-Laundry-Mart/" 
                   class="github-link pages-link" 
                   target="_blank">
                    <span class="link-icon">🌐</span>
                    Live Demo (GitHub Pages)
                    <div class="link-description">Try the application</div>
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const imageContainer = document.getElementById('imageContainer');
            const textContainer = document.getElementById('textContainer');
            const timerElement = document.getElementById('timer');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const exitFullscreenBtn = document.getElementById('exitFullscreenBtn');
            const replayBtn = document.getElementById('replayBtn');
            const mainImage = document.getElementById('mainImage');
            
            let countdown = 10;
            let timerInterval;
            
            function startTimer() {
                countdown = 10;
                timerElement.textContent = countdown;
                
                if (timerInterval) {
                    clearInterval(timerInterval);
                }
                
                timerInterval = setInterval(() => {
                    countdown--;
                    timerElement.textContent = countdown;
                    
                    if (countdown <= 0) {
                        clearInterval(timerInterval);
                        
                        // Hide image and show text
                        imageContainer.style.opacity = '0';
                        
                        // Show text after a brief delay
                        setTimeout(() => {
                            textContainer.classList.add('visible');
                        }, 500);
                    }
                }, 1000);
            }
            
            // Start the initial timer
            startTimer();
            
            // Fullscreen functionality
            function enterFullscreen() {
                imageContainer.classList.add('fullscreen');
                document.body.style.overflow = 'hidden';
            }
            
            function exitFullscreen() {
                imageContainer.classList.remove('fullscreen');
                document.body.style.overflow = 'auto';
            }
            
            // Event listeners
            fullscreenBtn.addEventListener('click', enterFullscreen);
            exitFullscreenBtn.addEventListener('click', exitFullscreen);
            mainImage.addEventListener('click', enterFullscreen);
            
            // Replay animation
            replayBtn.addEventListener('click', function() {
                imageContainer.style.opacity = '1';
                textContainer.classList.remove('visible');
                startTimer();
                
                // Reset progress bar animation
                const progressBar = document.querySelector('.progress');
                progressBar.style.animation = 'none';
                setTimeout(() => {
                    progressBar.style.animation = 'progress 10s linear forwards';
                }, 10);
            });
            
            // Exit fullscreen with Escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    exitFullscreen();
                }
            });
        });
    </script>
</body>
</html>
